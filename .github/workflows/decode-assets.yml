name: Decode assets
on:
  push:
    paths:
      - 'encoded/**'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets to binary
        run: |
          set -euo pipefail
          mkdir -p assets
          for f in encoded/*.b64; do
            name=$(basename "$f" .b64)
            base64 -d "$f" > "assets/$name"
            echo "decoded $name ($(wc -c < "assets/$name") bytes)"
            file "assets/$name" || true
          done
      - name: Commit binaries
        run: |
          set -euo pipefail
          git config user.name "devto-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add decoded binary assets for Dev.to"
          git push
